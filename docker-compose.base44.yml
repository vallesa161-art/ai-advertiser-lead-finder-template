services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - VITE_BASE44_APP_BASE_URL=https://base44.app
    env_file:
      - /run/base44/app.env
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    restart: unless-stopped

volumes:
  node_modules:
